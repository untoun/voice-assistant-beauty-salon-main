version: '3.9'

services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./logs:/app/logs
    tmpfs:
      - /tmp:size=100m  # Для временных аудио файлов
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from config import settings; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s